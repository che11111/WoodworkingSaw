# 右键锯木台的转化规则（独立配置文件，可删除/调整顺序/新增）。
# Right-click transformation rules (standalone file; delete, reorder, or add).
# 每条规则：input=输入物品，output=输出物品；
# Each rule: input=item in, output=item out;
#   input-amount=每次消耗的原料数量，output-amount=每次产出的产物数量。
#   input-amount=items consumed per craft, output-amount=items produced per craft.
# 普通右键转化 1 份配方；潜行右键是否转化手中整组由 config.yml 的 transform.sneak-all 控制。
# Normal right-click crafts 1 recipe; sneaking is controlled by transform.sneak-all in config.yml.
# 同一输入有多条规则时，按顺序取第一条。
# When one input has multiple rules, the first match wins.
#
# ┌─ 目前内置的转化链──────────────────────────────────┐
# │ 原木/菌柄 → 去皮木/去皮菌柄 → 栅栏 → 栅栏门 → 按钮     │
# │ 木板 → 楼梯 → 半砖 → 压力板 → 按钮                   │
# │ 门 → 活板门 → 按钮                                 │
# │ 树苗 → 木棍；                                      │
# │ 花丛 → 小花；大型垂滴叶 → 小型垂滴叶                  │
# │ 珊瑚块 → 珊瑚；蜘蛛网 → 蜘蛛丝                       │
# │ 硫黄 → 硫黄尖锥；滴水石块 → 滴水石锥；岩浆块 → 2 岩浆膏 │
# │ 床 → 羊毛 → [26.3+: 楼梯 → 台阶 → 坐垫] → 地毯 → 线  │
# │ 旧版本自动回退为：羊毛 → 地毯 → 线                    │
# └──────────────────────────────────────────────────┘
rules:
    # 橡木原木 → 去皮橡木原木
    - input: minecraft:oak_log
      output: minecraft:stripped_oak_log
      input-amount: 1
      output-amount: 1
    # 去皮橡木原木 → 橡木栅栏
    - input: minecraft:stripped_oak_log
      output: minecraft:oak_fence
      input-amount: 1
      output-amount: 1
    # 橡木木板 → 橡木楼梯
