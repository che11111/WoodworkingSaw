# 语言：auto，或 lang/ 下的文件名。
# Language: auto, or a file name under lang/.
#
# auto 会识别服务器 Locale；无法识别时使用 en_us.yml。
# auto detects the server Locale and falls back to en_us.yml when unrecognized.
# 内置：en_us.yml、zh_cn.yml、ja.yml、ko.yml、zh_tw.yml、de.yml、fr.yml、es.yml、ru.yml
# Bundled: en_us.yml, zh_cn.yml, ja.yml, ko.yml, zh_tw.yml, de.yml, fr.yml, es.yml, ru.yml
language: auto

transform:
  # 潜行时右键是否转化手中整组
  # Whether sneaking + right-click transforms the whole stack.
  sneak-all: true

feedback:
  # 转化时播放音效 / Play a sound when transforming.
  sound: true
  # 转化时显示动作栏提示 / Show an action-bar message when transforming.
  action-bar: true

craftengine:
  # 把内置配置与资源包写入 CraftEngine/resources/WoodworkingSaw。
  # Copy the bundled config and resource pack into CraftEngine/resources/WoodworkingSaw.
  auto-install: true


# 仅在启动或重载 5 秒后检查一次 GitHub 最新正式版，只在控制台提醒；不通知管理员，不自动替换 JAR。
# Check GitHub stable releases once, 5 seconds after startup or reload. Log to console only; do not notify administrators or replace the JAR automatically.
check-for-updates: true

# 是否启用 bStats 匿名统计
# Whether to enable bStats anonymous metrics.
bstats:
  enabled: true
