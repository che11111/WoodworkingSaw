  update-disabled: "{prefix}&#F2A7B3更新確認は config.yml で無効になっています。"
  update-wait: "{prefix}&#F2A7B3確認はすでに実行中です。後でもう一度お試しください。"
  help-usage: "{prefix}&#F3EFE7素手で左クリックすると加工画面を開き、右クリックで手に持ったアイテムを加工します（スニークでスタック全体）。"
