  help-status: "{prefix}&#F3EFE7/{label} status &#B4AEAA- 現在の状態を表示"
  help-reload: "{prefix}&#F3EFE7/{label} reload &#B4AEAA- 設定を再読み込みしてリソースを再インポート"
  help-update: "{prefix}&#F3EFE7/{label} update &#B4AEAA- GitHub の最新安定版を確認"

logs:
