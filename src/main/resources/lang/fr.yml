# Français. Modifiable. Le mode auto suit la Locale du serveur.
messages:
  prefix: "&#C9B6E4[Table de sciage] &#F3EFE7"
  action-bar: "&#F7C5CC{count} &#FFFFFFobjet(s) transformé(s)"
  no-permission-give: "{prefix}&#F2A7B3Vous n’avez pas la permission d’obtenir une table de sciage."
  no-permission-status: "{prefix}&#F2A7B3Vous n’avez pas la permission d’afficher l’état."
  no-permission-reload: "{prefix}&#F2A7B3Vous n’avez pas la permission de recharger."
  no-permission-update: "{prefix}&#F2A7B3Vous n’avez pas la permission de vérifier les mises à jour."
  player-not-found: "{prefix}&#F2A7B3Joueur hors ligne : &#A3D1E0{player}"
  console-usage: "{prefix}&#F2A7B3La console doit indiquer un joueur : /sawtable give <joueur> [quantité]"
  invalid-amount: "{prefix}&#F2A7B3La quantité doit être comprise entre 1 et 64."
  item-not-loaded: "{prefix}&#F2A7B3L’objet table de sciage n’est pas encore chargé. Exécutez &#FFFFFF/ce reload all &#F2A7B3puis réessayez."
  give-success: "{prefix}&#A9DCC3&#FFFFFF{amount} &#A9DCC3table(s) de sciage donnée(s) à &#A3D1E0{player}&#A9DCC3."
  status-block-loaded: "{prefix}&#A9DCC3Bloc table de sciage : chargé"
  status-block-not-loaded: "{prefix}&#F2A7B3Bloc table de sciage : non chargé"
  status-resource-dir: "{prefix}&#F3EFE7Dossier des ressources : &#A3D1E0{path}"
  reload-success: "{prefix}&#A9DCC3Configuration rechargée et ressources vérifiées."
  reload-failed: "{prefix}&#F2A7B3Échec du rechargement : &#A3D1E0{error}"
  resource-uploaded: "{prefix}&#F7C5CCRessources de la table de sciage copiées vers &#F3EFE7{path}&#F7C5CC. Exécutez &#FFFFFF/ce reload all&#F7C5CC."
  resource-diff: "{prefix}&#F2A7B3Les ressources CraftEngine diffèrent de la sauvegarde : &#A3D1E0{files}. Synchronisez les changements puis exécutez &#FFFFFF/ce reload all&#F2A7B3."
  update-available: "{prefix}&#F7C5CCNouvelle version &#FFFFFF{latest} &#F3EFE7disponible (actuelle &#A3D1E0{current}&#F3EFE7) : &#A3D1E0{url}"
  update-checking: "{prefix}&#A9DCC3Vérification des versions GitHub. Veuillez patienter."
  update-no-new: "{prefix}&#A9DCC3Aucune nouvelle version stable trouvée ; vous êtes peut-être déjà à jour."
  update-failed: "{prefix}&#F2A7B3Impossible de vérifier les mises à jour. Réessayez plus tard ; le plugin reste fonctionnel."
  update-disabled: "{prefix}&#F2A7B3La vérification des mises à jour est désactivée dans config.yml."
  update-wait: "{prefix}&#F2A7B3Une vérification est déjà en cours, ou réessayez plus tard."
  help-usage: "{prefix}&#F3EFE7Clic gauche à main vide pour ouvrir le menu de découpe ; clic droit pour transformer l’objet tenu (accroupi : toute la pile)."
  help-give: "{prefix}&#F3EFE7/{label} give [joueur] [quantité] &#B4AEAA- obtenir une table de sciage"
  help-status: "{prefix}&#F3EFE7/{label} status &#B4AEAA- afficher l’état actuel"
  help-reload: "{prefix}&#F3EFE7/{label} reload &#B4AEAA- recharger et réimporter les ressources"
  help-update: "{prefix}&#F3EFE7/{label} update &#B4AEAA- vérifier la dernière version stable GitHub"

logs:
  enabled: "WoodworkingSaw {version} activé. Langue : {language}."
  craftengine-connected: "Connecté aux événements de blocs personnalisés CraftEngine."
  interaction-failed: "Impossible de traiter une interaction avec la table de sciage CraftEngine : {error}"
  item-build-failed: "Impossible de créer l’objet table de sciage CraftEngine : {error}"
  reload-failed: "Échec du rechargement : {error}"
  resource-uploaded: "Ressources de la table de sciage copiées vers {path}. Exécutez /ce reload all."
  resource-diff: "Les ressources CraftEngine diffèrent de la sauvegarde : {files}. Synchronisez-les et exécutez /ce reload all."
  resource-up-to-date: "Les ressources CraftEngine de la table de sciage sont à jour."
  init-failed: "Échec de l’initialisation de la table de sciage CraftEngine : {error}"
  update-available: "Nouvelle version {latest} disponible (actuelle {current}) : {url}"
  update-check-failed: "Échec de la vérification GitHub ; nouvel essai au prochain démarrage ou rechargement : {error}"
  transform-version-skipped: "{count} objet(s) de transformation indisponible(s) sur ce serveur ont été ignoré(s) (par ex. : {items}) ; les autres règles restent actives."
  cer-api-connected: "{count} recette(s) de table de sciage publiée(s) dans l’API CraftEngineRecipe."
  cer-api-unavailable: "CraftEngineRecipe est détecté, mais son service d’API de recettes n’est pas encore disponible."
  cer-api-failed: "Échec de la publication des recettes dans l’API CraftEngineRecipe : {error}"
  metrics-failed: "Impossible d’initialiser bStats ; le plugin reste fonctionnel : {error}"
