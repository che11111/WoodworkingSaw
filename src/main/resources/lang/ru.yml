  help-status: "{prefix}&#F3EFE7/{label} status &#B4AEAA- показать текущее состояние"
  help-reload: "{prefix}&#F3EFE7/{label} reload &#B4AEAA- перезагрузить конфигурацию и импортировать ресурсы"
  help-update: "{prefix}&#F3EFE7/{label} update &#B4AEAA- проверить последнюю стабильную версию GitHub"

