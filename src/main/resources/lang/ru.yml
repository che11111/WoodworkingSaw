  no-permission-status: "{prefix}&#F2A7B3У вас нет разрешения на просмотр состояния."
  no-permission-reload: "{prefix}&#F2A7B3У вас нет разрешения на перезагрузку."
  no-permission-update: "{prefix}&#F2A7B3У вас нет разрешения на проверку обновлений."
