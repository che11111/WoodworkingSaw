  update-available: "{prefix}&#F7C5CCДоступна новая версия &#FFFFFF{latest} &#F3EFE7(текущая &#A3D1E0{current}&#F3EFE7): &#A3D1E0{url}"
  update-checking: "{prefix}&#A9DCC3Проверка GitHub Releases. Подождите."
  update-no-new: "{prefix}&#A9DCC3Новая стабильная версия не найдена; возможно, у вас уже последняя версия."
