  status-block-loaded: "{prefix}&#A9DCC3Блок столярного верстака: загружен"
  status-block-not-loaded: "{prefix}&#F2A7B3Блок столярного верстака: не загружен"
  status-resource-dir: "{prefix}&#F3EFE7Каталог ресурсов: &#A3D1E0{path}"
