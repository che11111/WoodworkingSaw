# Español. Editable. El modo auto usa la configuración regional del servidor.
messages:
  prefix: "&#C9B6E4[Mesa de aserrado] &#F3EFE7"
  action-bar: "&#F7C5CCSe transformaron &#FFFFFF{count} &#F7C5CCobjeto(s)"
  no-permission-give: "{prefix}&#F2A7B3No tienes permiso para obtener una mesa de aserrado."
  no-permission-status: "{prefix}&#F2A7B3No tienes permiso para ver el estado."
  no-permission-reload: "{prefix}&#F2A7B3No tienes permiso para recargar."
  no-permission-update: "{prefix}&#F2A7B3No tienes permiso para buscar actualizaciones."
  player-not-found: "{prefix}&#F2A7B3El jugador no está conectado: &#A3D1E0{player}"
  console-usage: "{prefix}&#F2A7B3La consola debe indicar un jugador: /sawtable give <jugador> [cantidad]"
  invalid-amount: "{prefix}&#F2A7B3La cantidad debe estar entre 1 y 64."
  item-not-loaded: "{prefix}&#F2A7B3La mesa de aserrado aún no está cargada. Ejecuta &#FFFFFF/ce reload all &#F2A7B3y vuelve a intentarlo."
  give-success: "{prefix}&#A9DCC3Se entregaron &#FFFFFF{amount} &#A9DCC3mesa(s) de aserrado a &#A3D1E0{player}&#A9DCC3."
  status-block-loaded: "{prefix}&#A9DCC3Bloque de mesa de aserrado: cargado"
  status-block-not-loaded: "{prefix}&#F2A7B3Bloque de mesa de aserrado: no cargado"
  status-resource-dir: "{prefix}&#F3EFE7Directorio de recursos: &#A3D1E0{path}"
  reload-success: "{prefix}&#A9DCC3Configuración recargada y recursos comprobados."
  reload-failed: "{prefix}&#F2A7B3Error al recargar: &#A3D1E0{error}"
  resource-uploaded: "{prefix}&#F7C5CCRecursos de la mesa de aserrado copiados a &#F3EFE7{path}&#F7C5CC. Ejecuta &#FFFFFF/ce reload all&#F7C5CC."
  resource-diff: "{prefix}&#F2A7B3Los recursos de CraftEngine difieren de la copia de seguridad: &#A3D1E0{files}. Sincroniza los cambios y ejecuta &#FFFFFF/ce reload all&#F2A7B3."
  update-available: "{prefix}&#F7C5CCNueva versión &#FFFFFF{latest} &#F3EFE7disponible (actual &#A3D1E0{current}&#F3EFE7): &#A3D1E0{url}"
  update-checking: "{prefix}&#A9DCC3Comprobando GitHub Releases. Espera un momento."
  update-no-new: "{prefix}&#A9DCC3No hay una nueva versión estable; puede que ya estés actualizado."
  update-failed: "{prefix}&#F2A7B3No se pudieron comprobar las actualizaciones. Inténtalo más tarde; el plugin sigue funcionando."
  update-disabled: "{prefix}&#F2A7B3La comprobación de actualizaciones está desactivada en config.yml."
  update-wait: "{prefix}&#F2A7B3Ya hay una comprobación en curso o inténtalo más tarde."
  help-usage: "{prefix}&#F3EFE7Clic izquierdo con la mano vacía abre el menú de corte; clic derecho transforma el objeto en la mano (agachado: toda la pila)."
  help-give: "{prefix}&#F3EFE7/{label} give [jugador] [cantidad] &#B4AEAA- obtener una mesa de aserrado"
  help-status: "{prefix}&#F3EFE7/{label} status &#B4AEAA- ver el estado actual"
  help-reload: "{prefix}&#F3EFE7/{label} reload &#B4AEAA- recargar e importar de nuevo los recursos"
  help-update: "{prefix}&#F3EFE7/{label} update &#B4AEAA- comprobar la última versión estable de GitHub"

logs:
  enabled: "WoodworkingSaw {version} activado. Idioma: {language}."
  craftengine-connected: "Conectado a los eventos de bloques personalizados de CraftEngine."
  interaction-failed: "No se pudo procesar una interacción con la mesa de aserrado de CraftEngine: {error}"
  item-build-failed: "No se pudo crear el objeto de mesa de aserrado de CraftEngine: {error}"
  reload-failed: "Error al recargar: {error}"
  resource-uploaded: "Recursos de la mesa de aserrado copiados a {path}. Ejecuta /ce reload all."
  resource-diff: "Los recursos de CraftEngine difieren de la copia de seguridad: {files}. Sincronízalos y ejecuta /ce reload all."
  resource-up-to-date: "Los recursos de CraftEngine de la mesa de aserrado están actualizados."
  init-failed: "Error al inicializar la mesa de aserrado de CraftEngine: {error}"
  update-available: "Nueva versión {latest} disponible (actual {current}): {url}"
  update-check-failed: "Error al comprobar GitHub; se reintentará al iniciar o recargar: {error}"
  transform-version-skipped: "Se omitieron {count} objeto(s) de transformación no disponibles en este servidor (por ejemplo: {items}); las demás reglas siguen activas."
  cer-api-connected: "Se publicaron {count} receta(s) de mesa de aserrado en la API de CraftEngineRecipe."
  cer-api-unavailable: "Se detectó CraftEngineRecipe, pero su servicio de API de recetas aún no está disponible."
  cer-api-failed: "No se pudieron publicar las recetas de transformación en la API de CraftEngineRecipe: {error}"
  metrics-failed: "No se pudo inicializar bStats; el plugin sigue funcionando: {error}"
