# English. Editable; missing entries are added on startup or reload.
messages:
  prefix: '&#C9B6E4[Saw Table] &#F3EFE7'
  action-bar: '&#F7C5CCCut &#FFFFFF{count} &#F7C5CCitem(s)'
  no-permission-give: '{prefix}&#F2A7B3You do not have permission to obtain the saw table.'
  no-permission-status: '{prefix}&#F2A7B3You do not have permission to view the status.'
  no-permission-reload: '{prefix}&#F2A7B3You do not have permission to reload.'
  player-not-found: '{prefix}&#F2A7B3Player not online: &#A3D1E0{player}'
  console-usage: '{prefix}&#F2A7B3The console must specify a player: /sawtable give <player> [amount]'
  invalid-amount: '{prefix}&#F2A7B3The amount must be between 1 and 64.'
  item-not-loaded: '{prefix}&#F2A7B3The saw table item is not loaded yet. Run &#FFFFFF/ce reload all &#F2A7B3and try again.'
  give-success: '{prefix}&#A9DCC3Gave &#FFFFFF{amount} &#A9DCC3saw table(s) to &#A3D1E0{player}&#A9DCC3.'
  status-block-loaded: '{prefix}&#A9DCC3Saw table block: loaded'
  status-block-not-loaded: '{prefix}&#F2A7B3Saw table block: not loaded'
  status-resource-dir: '{prefix}&#F3EFE7Resource directory: &#A3D1E0{path}'
  reload-success: '{prefix}&#A9DCC3Configuration reloaded and resources checked.'
  reload-failed: '{prefix}&#F2A7B3Reload failed: &#A3D1E0{error}'
  resource-uploaded: '{prefix}&#F7C5CCSaw table resources uploaded to &#F3EFE7{path}. Run &#FFFFFF/ce reload all &#F7C5CCto apply the CraftEngine resources.'
  resource-diff: '{prefix}&#F2A7B3CraftEngine resources differ from the backup: &#A3D1E0{files}. You modified these files but have not applied them to CraftEngine. Sync your changes and run &#FFFFFF/ce reload all&#F2A7B3.'
  help-usage: '{prefix}&#F3EFE7Left-click with an empty hand to open the cutting menu, right-click to transform the held item (sneak to transform the whole stack).'
  help-give: '{prefix}&#F3EFE7/{label} give [player] [amount] &#B4AEAA- get a saw table'
  help-status: '{prefix}&#F3EFE7/{label} status &#B4AEAA- view the current status'
  help-reload: '{prefix}&#F3EFE7/{label} reload &#B4AEAA- reload config and re-import resources'

logs:
  enabled: 'WoodworkingSaw {version} enabled. Language: {language}.'
  resource-uploaded: 'Saw table resources uploaded to {path}. Run /ce reload all to apply the CraftEngine resources.'
  resource-diff: 'CraftEngine resources differ from the backup: {files}. Sync your changes and run /ce reload all to apply.'
  resource-up-to-date: 'CraftEngine saw table resources are up to date.'
  init-failed: 'Failed to initialize the CraftEngine saw table: {error}'
  metrics-failed: 'Could not initialize bStats; the plugin is unaffected: {error}'
