name: WoodworkingSaw
version: '${project.version}'
main: dev.che1s.woodworkingsaw.WoodworkingSawPlugin
api-version: '${mc.api.version}'
author: che1s
description: 锯木台：左键打开切割界面，右键转化手中物品（潜行转化整组），依赖 CraftEngine
depend: [ CraftEngine ]
softdepend: [ CraftEngineRecipe ]
folia-supported: true

commands:
  sawtable:
    description: 获取或管理锯木台
    usage: /sawtable [give|status|reload|update]
    aliases: [ woodworking ]

permissions:
  woodworkingsaw.use:
    description: 使用锯木台去皮
    default: true
  woodworkingsaw.give:
    description: 获取锯木台
    default: op
  woodworkingsaw.admin:
    description: 查看状态、重新导入资源并检查更新
    default: op
